<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Můj první web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Můj první web</h1>
      <p>
        Vítej! Tohle je jednoduchý základ webu, který můžeš dál rozšiřovat.
      </p>

      <section class="card">
        <h2>Co můžeš udělat dál?</h2>
        <ul>
          <li>Změnit barvy a fonty v <code>style.css</code>.</li>
          <li>Přidat vlastní obsah do <code>index.html</code>.</li>
          <li>
            Vyzkoušet tlačítko níže a upravit jeho chování v
            <code>script.js</code>.
          </li>
        </ul>
        <button id="helloBtn">Klikni na mě</button>
        <p id="message" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
